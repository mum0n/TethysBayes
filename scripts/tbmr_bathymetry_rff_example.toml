# ==============================================================================
# TethysBayes Model Configuration: Scotian Shelf Bathymetry
# Model 1: Random Fourier Features (RFF) Continuous Spatial Field
# Reference: docs/bathymetry/bathymetry.md
# Usage:
#   julia --project=. scripts/TethysBayesr.jl <config.toml> [options]
#   julia --project=. scripts/TethysBayesr.jl --config=<config.toml> [options]
#   julia --project=. scripts/TethysBayesr.jl --help
# ==============================================================================

[metadata]
name = "scotian_shelf_rff"
description = "Random Fourier Features (RFF) spatial bathymetry model for Scotian Shelf, Canada"
project = "Scotian Shelf Ecosystem Mapping"
author = "Jae S. Choi"

[environment]
# Run-specific user libraries to load (e.g. "RData", "SpatialData", "GeoStats")
packages = ["RData"]

[data]
# Path to input dataset (.rda, .jld2, .csv, or .duckdb)
path = "data/scotian_shelf_bathymetry_subset.rda"
# Key or table name within the data container
key = "bathy"
# Format: "auto", "rda", "jld2", "csv", or "duckdb"
format = "rda"

[preprocessing]
# Optional run-specific preprocessing libraries
packages = []
# Optional user-defined Julia script to include (executes in Main with `df_input`, outputs `df_output`)
# script = "preprocess_bathymetry.jl"
# Optional name of a transformation function defined in Main (e.g. `clean_survey_data`)
# transform = "clean_survey_data"
# Optional inline Julia expression or block transforming the DataFrame `df`:
# code = "filter(:z => !isnan, df)"

[model]
# Model formula matching @tbm specification syntax:
# m_rff = @tbm(likelihood(z) ~ intercept() + random(plat, plon, model = rff, n_features = 30), df_bathy)
formula = "likelihood(z, family = gaussian) ~ intercept() + random(plat, plon, model = rff, n_features = 30)"

# Computational options
verbose = false
use_gpu = false
prior_scheme = "pcpriors"

[sampling]
# Whether to draw MCMC samples (set to false to only instantiate/compile model)
sample = true
# Sampler strategy: "optimal" (auto-calibrated / promoted), "nuts", "gibbs", or "mh"
sampler = "optimal"
# Sampling dimensions
n_samples = 100
n_warmup = 50
n_chains = 1
target_accept = 0.8
progress = true

[output]
# Destination file path (can be .jld2 or .duckdb)
path = "work/scotian_shelf_rff.jld2"
# Output format: "jld2" (complete model & state), "duckdb" (analytical tables), or "both"
format = "jld2"
# Data compression
compress = true
# Table prefix for DuckDB exports
table_prefix = "rff_"
